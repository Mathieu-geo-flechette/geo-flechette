      function pointToCoordinates(x, y, width, height, map) {
        const zone = CONFIG.zones[map];
        return {
          lon: zone.lonMin + (x / width) * (zone.lonMax - zone.lonMin),
          lat: zone.latMax - (y / height) * (zone.latMax - zone.latMin)
        };
      }

      function drawImpact(context, x, y, size) {
        const radius = clamp(size * 0.052, 22, 80);
        const lineWidth = clamp(size * 0.008, 4, 14);

        context.save();
        context.lineWidth = lineWidth;
        context.strokeStyle = "#ff3b30";
        context.fillStyle = "#ff3b30";

        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.stroke();

        context.beginPath();
        context.arc(x, y, radius * 0.58, 0, Math.PI * 2);
        context.stroke();

        context.beginPath();
        context.arc(x, y, Math.max(5, radius * 0.16), 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawLabel(context, text, x, y, size) {
        const widthLimit = typeof size === "number" ? size : size.width;
        const heightLimit = typeof size === "number" ? size : size.height;
        const baseSize = Math.min(widthLimit, heightLimit);
        const label = String(text || "Lieu inconnu").trim();
        const padding = Math.max(12, baseSize * 0.018);
        const maxWidth = widthLimit - padding * 2;
        let fontSize = clamp(baseSize * 0.055, 24, 62);

        context.save();
        do {
          context.font = `800 ${fontSize}px Inter, Arial, sans-serif`;
          if (context.measureText(label).width <= maxWidth) break;
          fontSize -= 2;
        } while (fontSize > 18);

        const width = Math.min(context.measureText(label).width, maxWidth);
        let labelX = x + padding;
        let labelY = y - padding;

        if (labelX + width > widthLimit - padding) labelX = widthLimit - padding - width;
        if (labelX < padding) labelX = padding;
        if (labelY < fontSize + padding) labelY = y + fontSize + padding;
        if (labelY > heightLimit - padding) labelY = heightLimit - padding;

        context.lineJoin = "round";
        context.strokeStyle = "rgba(0, 0, 0, 0.88)";
        context.lineWidth = Math.max(4, fontSize * 0.16);
        context.strokeText(label, labelX, labelY, maxWidth);
        context.fillStyle = "#ffd166";
        context.fillText(label, labelX, labelY, maxWidth);
        context.restore();
      }

      /*-------------
        Detect corner
      --------------*/
      function detectArucoFrameCorners(src) {
        const maxSide = Math.max(src.cols, src.rows);
        const scale = Math.min(1, CONFIG.detectionMaxSide / maxSide);
        let work = null;

        try {
          if (scale < 1) {
            work = new cv.Mat();
            cv.resize(src, work, new cv.Size(Math.round(src.cols * scale), Math.round(src.rows * scale)), 0, 0, cv.INTER_AREA);
          } else {
            work = src.clone();
          }

          const markers = detectArucoMarkers(work);
          if (markers.length < 4) return null;

          // Les IDs valident que ce sont les bons marqueurs, mais la géométrie
          // finale privilégie leur position réelle dans la photo.
          const byId = bestArucoMarkersById(markers);
          const byPosition = buildArucoFrameFromPositions(byId, work.cols, work.rows);
          const byRole = buildArucoFrameFromRoles(byId, work.cols, work.rows);
          const frame = byPosition || byRole;
          if (!frame) return null;

          return {
            corners: frame.points.map((point) => ({
              x: point.x / scale,
              y: point.y / scale
            })),
            confidence: frame.confidence,
            label: frame.label
          };
        } catch (error) {
          console.warn("Détection ArUco échouée", error);
          return null;
        } finally {
          deleteMat(work);
        }
      }

      function detectArucoMarkers(src) {
        const markers = [];
        let gray = null;
        let blurred = null;
        let darkMask = null;
        let adaptiveMask = null;
        let otsuMask = null;

        try {
          gray = new cv.Mat();
          blurred = new cv.Mat();
          darkMask = new cv.Mat();
          adaptiveMask = new cv.Mat();
          otsuMask = new cv.Mat();

          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(3, 3), 0);

          // Plusieurs masques donnent plus de chances de séparer les marqueurs
          // d'une cible colorée, de textes noirs ou d'illustrations voisines.
          cv.threshold(blurred, darkMask, 72, 255, cv.THRESH_BINARY_INV);
          cv.adaptiveThreshold(blurred, adaptiveMask, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 35, 5);
          cv.threshold(blurred, otsuMask, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

          // L'ouverture casse les petites connexions avec le fond imprimé.
          // La fermeture répare ensuite les bords noirs du marqueur.
          collectArucoMarkersFromMask(src, darkMask, markers, { openSize: 7, closeSize: 3 });
          collectArucoMarkersFromMask(src, adaptiveMask, markers, { openSize: 5, closeSize: 3 });
          collectArucoMarkersFromMask(src, otsuMask, markers, { openSize: 5, closeSize: 3 });
          return dedupeArucoMarkers(markers);
        } finally {
          deleteMat(gray);
          deleteMat(blurred);
          deleteMat(darkMask);
          deleteMat(adaptiveMask);
          deleteMat(otsuMask);
        }
      }

      function collectArucoMarkersFromMask(src, mask, markers, options = {}) {
        let cleaned = null;
        let openKernel = null;
        let closeKernel = null;
        let contours = null;
        let hierarchy = null;

        try {
          cleaned = mask.clone();
          if (options.openSize) {
            openKernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(options.openSize, options.openSize));
            cv.morphologyEx(cleaned, cleaned, cv.MORPH_OPEN, openKernel);
          }
          if (options.closeSize) {
            closeKernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(options.closeSize, options.closeSize));
            cv.morphologyEx(cleaned, cleaned, cv.MORPH_CLOSE, closeKernel);
          }

          contours = new cv.MatVector();
          hierarchy = new cv.Mat();
          cv.findContours(cleaned, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          const imageArea = src.cols * src.rows;
          for (let i = 0; i < contours.size(); i += 1) {
            const contour = contours.get(i);
            let approx = null;

            try {
              // Un marqueur attendu est un quadrilatère noir assez grand,
              // mais jamais de la taille du cadre complet de la cible.
              const area = cv.contourArea(contour);
              if (area < imageArea * 0.00018 || area > imageArea * 0.13) continue;

              const peri = cv.arcLength(contour, true);
              approx = new cv.Mat();
              cv.approxPolyDP(contour, approx, Math.max(3, 0.035 * peri), true);
              if (approx.rows !== 4) continue;

              const points = orderCorners(pointsFromApprox(approx));
              if (!isPlausibleArucoQuad(points, src.cols, src.rows)) continue;

              // Chaque quadrilatère plausible est redressé puis comparé aux
              // quatre motifs 4x4 connus, avec rotation et petite tolérance.
              const marker = decodeArucoCandidate(src, points, area);
              if (marker) markers.push(marker);
            } finally {
              deleteMat(approx);
              deleteMat(contour);
            }
          }
        } finally {
          deleteMat(cleaned);
          deleteMat(openKernel);
          deleteMat(closeKernel);
          deleteMat(contours);
          deleteMat(hierarchy);
        }
      }

      function isPlausibleArucoQuad(points, width, height) {
        const area = polygonArea(points);
        const imageArea = width * height;
        if (area < imageArea * 0.00018 || area > imageArea * 0.13) return false;

        const sides = [
          distance(points[0], points[1]),
          distance(points[1], points[2]),
          distance(points[2], points[3]),
          distance(points[3], points[0])
        ];
        const shortest = Math.min(...sides);
        const longest = Math.max(...sides);
        return shortest > Math.min(width, height) * 0.018 && longest / shortest < 3.2;
      }

      function decodeArucoCandidate(src, points, area) {
        const markerSize = 90;
        let srcPts = null;
        let dstPts = null;
        let homography = null;
        let warped = null;
        let gray = null;

        try {
          srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
            points[0].x, points[0].y,
            points[1].x, points[1].y,
            points[2].x, points[2].y,
            points[3].x, points[3].y
          ]);
          dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
            0, 0,
            markerSize, 0,
            markerSize, markerSize,
            0, markerSize
          ]);

          homography = cv.getPerspectiveTransform(srcPts, dstPts);
          warped = new cv.Mat();
          gray = new cv.Mat();
          cv.warpPerspective(src, warped, homography, new cv.Size(markerSize, markerSize), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
          cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);

          // Le marqueur imprimé fait 6x6 cellules : bord noir inclus,
          // coeur 4x4 utile au centre.
          const matrix = sampleArucoMatrix(gray, 6);
          if (!matrix) return null;

          const match = matchArucoPattern(matrix);
          if (!match) return null;

          return {
            id: match.id,
            rotation: match.rotation,
            score: match.score,
            mismatch: match.mismatch,
            area,
            corners: points,
            center: centroid(points)
          };
        } finally {
          deleteMat(srcPts);
          deleteMat(dstPts);
          deleteMat(homography);
          deleteMat(warped);
          deleteMat(gray);
        }
      }

      function sampleArucoMatrix(gray, cells) {
        const cellWidth = gray.cols / cells;
        const cellHeight = gray.rows / cells;
        const means = [];

        for (let y = 0; y < cells; y += 1) {
          const row = [];
          for (let x = 0; x < cells; x += 1) {
            row.push(sampleGrayCell(gray, x * cellWidth, y * cellHeight, cellWidth, cellHeight));
          }
          means.push(row);
        }

        const values = means.flat();
        const min = Math.min(...values);
        const max = Math.max(...values);
        if (max - min < 28) return null;

        const threshold = (min + max) / 2;
        return means.map((row) => row.map((value) => (value > threshold ? 1 : 0)));
      }

      function sampleGrayCell(gray, x, y, width, height) {
        const left = Math.max(0, Math.round(x + width * 0.28));
        const right = Math.min(gray.cols - 1, Math.round(x + width * 0.72));
        const top = Math.max(0, Math.round(y + height * 0.28));
        const bottom = Math.min(gray.rows - 1, Math.round(y + height * 0.72));
        let sum = 0;
        let count = 0;

        for (let py = top; py <= bottom; py += 1) {
          const rowOffset = py * gray.cols;
          for (let px = left; px <= right; px += 1) {
            sum += gray.data[rowOffset + px];
            count += 1;
          }
        }

        return count ? sum / count : 0;
      }

      function matchArucoPattern(matrix) {
        let best = null;

        // On compare toutes les rotations pour accepter un marqueur posé
        // dans n'importe quel sens sur le coin de la cible.
        for (const [id, pattern] of ARUCO_MARKER_PATTERNS) {
          for (let rotation = 0; rotation < 4; rotation += 1) {
            const rotated = rotateMatrix(matrix, rotation);
            const mismatch = hammingDistance(rotated, pattern);
            const score = 1 - mismatch / 36;
            if (!best || mismatch < best.mismatch) {
              best = { id, rotation, mismatch, score };
            }
          }
        }

        return best && best.mismatch <= 5 ? best : null;
      }

      function rotateMatrix(matrix, turns) {
        let rotated = matrix;
        for (let turn = 0; turn < turns; turn += 1) {
          rotated = rotated[0].map((_, x) => rotated.map((row) => row[x]).reverse());
        }
        return rotated;
      }

      function hammingDistance(a, b) {
        let distanceValue = 0;
        for (let y = 0; y < a.length; y += 1) {
          for (let x = 0; x < a[y].length; x += 1) {
            if (a[y][x] !== b[y][x]) distanceValue += 1;
          }
        }
        return distanceValue;
      }

      function dedupeArucoMarkers(markers) {
        const sorted = markers.slice().sort((a, b) => b.score - a.score || b.area - a.area);
        const unique = [];

        for (const marker of sorted) {
          const duplicate = unique.some((item) => distance(item.center, marker.center) < Math.sqrt(Math.max(item.area, marker.area)) * 0.36);
          if (!duplicate) unique.push(marker);
        }

        return unique;
      }

      function bestArucoMarkersById(markers) {
        const expectedIds = new Set(ARUCO_FRAME_ROLES.map((item) => item.id));
        const byId = new Map();

        for (const marker of markers) {
          if (!expectedIds.has(marker.id)) continue;
          const previous = byId.get(marker.id);
          if (!previous || marker.score > previous.score || (marker.score === previous.score && marker.area > previous.area)) {
            byId.set(marker.id, marker);
          }
        }

        return byId;
      }

      function buildArucoFrameFromRoles(byId, width, height) {
        const markers = [];
        const points = [];

        for (const item of ARUCO_FRAME_ROLES) {
          const marker = byId.get(item.id);
          if (!marker) return null;
          markers.push(marker);
          points.push(selectArucoFrameCorner(marker, item.role));
        }

        return buildArucoFrameResult(points, markers, width, height, "ArUco 4x4");
      }

      function buildArucoFrameFromPositions(byId, width, height) {
        const markers = Array.from(byId.values());
        if (markers.length < 4) return null;

        // Le placement physique des IDs peut changer : on ordonne donc les
        // centres détectés pour reconstruire haut-gauche, haut-droite, etc.
        const centerRefs = markers.map((marker, index) => ({
          x: marker.center.x,
          y: marker.center.y,
          index
        }));
        const orderedCenters = orderCorners(centerRefs);
        const roles = ["topLeft", "topRight", "bottomRight", "bottomLeft"];
        const points = orderedCenters.map((center, index) => selectArucoFrameCorner(markers[center.index], roles[index]));
        const orderedMarkers = orderedCenters.map((center) => markers[center.index]);

        return buildArucoFrameResult(points, orderedMarkers, width, height, "ArUco 4x4 positions");
      }

      function buildArucoFrameResult(points, markers, width, height, label) {
        const ordered = orderCorners(points);
        if (!isValidQuad(ordered, width, height)) return null;

        const averageScore = markers.reduce((sum, marker) => sum + marker.score, 0) / markers.length;
        const confidence = clamp(averageScore * 0.72 + geometryScore(ordered, width, height) * 0.28, 0, 1);
        if (confidence < 0.64) return null;

        return { points: ordered, confidence, label };
      }

      function selectArucoFrameCorner(marker, role) {
        const corners = orderCorners(marker.corners);
        if (role === "topLeft") return corners[0];
        if (role === "topRight") return corners[1];
        if (role === "bottomRight") return corners[2];
        return corners[3];
      }

      function centroid(points) {
        return points.reduce(
          (sum, point) => ({ x: sum.x + point.x / points.length, y: sum.y + point.y / points.length }),
          { x: 0, y: 0 }
        );
      }

      function detectFrameCorners(src) {
        const maxSide = Math.max(src.cols, src.rows);
        const scale = Math.min(1, CONFIG.detectionMaxSide / maxSide);
        let work = null;

        try {
          if (scale < 1) {
            work = new cv.Mat();
            cv.resize(src, work, new cv.Size(Math.round(src.cols * scale), Math.round(src.rows * scale)), 0, 0, cv.INTER_AREA);
          } else {
            work = src.clone();
          }

          const candidates = [];
          collectEdgeCandidates(work, candidates);
          collectAdaptiveColorCandidates(work, candidates);
          collectAdaptiveThresholdCandidates(work, candidates);
          collectHoughCandidates(work, candidates);

          const best = chooseFrameCandidate(work, candidates);
          if (!best || best.confidence < 0.54) return null;

          return {
            corners: best.points.map((point) => ({
              x: point.x / scale,
              y: point.y / scale
            })),
            confidence: best.confidence,
            label: best.label
          };
        } finally {
          deleteMat(work);
        }
      }

      function collectAdaptiveColorCandidates(src, candidates) {
        let rgb = null;
        let hsv = null;
        let mask = null;
        let low = null;
        let high = null;
        let kernel = null;
        let contours = null;
        let hierarchy = null;

        try {
          rgb = new cv.Mat();
          hsv = new cv.Mat();
          mask = new cv.Mat();
          cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB);
          cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV);

          low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 42, 36, 0]);
          high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [179, 255, 255, 255]);
          cv.inRange(hsv, low, high, mask);

          kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(9, 9));
          cv.morphologyEx(mask, mask, cv.MORPH_OPEN, kernel);
          cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

          contours = new cv.MatVector();
          hierarchy = new cv.Mat();
          cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
          collectQuadCandidates(contours, src.cols * src.rows, "couleur adaptative", 0.9, candidates);
        } catch (error) {
          console.warn("Détection couleur adaptative échouée", error);
        } finally {
          deleteMat(rgb);
          deleteMat(hsv);
          deleteMat(mask);
          deleteMat(low);
          deleteMat(high);
          deleteMat(kernel);
          deleteMat(contours);
          deleteMat(hierarchy);
        }
      }

      function collectEdgeCandidates(src, candidates) {
        let gray = null;
        let blurred = null;
        let edges = null;
        let kernel = null;
        let contours = null;
        let hierarchy = null;

        try {
          gray = new cv.Mat();
          blurred = new cv.Mat();
          edges = new cv.Mat();
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
          cv.Canny(blurred, edges, 42, 150);

          kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(7, 7));
          cv.morphologyEx(edges, edges, cv.MORPH_CLOSE, kernel);

          contours = new cv.MatVector();
          hierarchy = new cv.Mat();
          cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
          collectQuadCandidates(contours, src.cols * src.rows, "contours", 1, candidates);
        } finally {
          deleteMat(gray);
          deleteMat(blurred);
          deleteMat(edges);
          deleteMat(kernel);
          deleteMat(contours);
          deleteMat(hierarchy);
        }
      }

      function collectAdaptiveThresholdCandidates(src, candidates) {
        let gray = null;
        let blurred = null;
        let mask = null;
        let kernel = null;
        let contours = null;
        let hierarchy = null;

        try {
          gray = new cv.Mat();
          blurred = new cv.Mat();
          mask = new cv.Mat();
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
          cv.adaptiveThreshold(blurred, mask, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 41, 7);

          kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(7, 7));
          cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

          contours = new cv.MatVector();
          hierarchy = new cv.Mat();
          cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
          collectQuadCandidates(contours, src.cols * src.rows, "contraste", 0.86, candidates);
        } finally {
          deleteMat(gray);
          deleteMat(blurred);
          deleteMat(mask);
          deleteMat(kernel);
          deleteMat(contours);
          deleteMat(hierarchy);
        }
      }

      function collectHoughCandidates(src, candidates) {
        let gray = null;
        let blurred = null;
        let edges = null;
        let lines = null;

        try {
          gray = new cv.Mat();
          blurred = new cv.Mat();
          edges = new cv.Mat();
          lines = new cv.Mat();
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
          cv.Canny(blurred, edges, 38, 135);

          const minSide = Math.min(src.cols, src.rows);
          cv.HoughLinesP(edges, lines, 1, Math.PI / 180, Math.max(50, Math.round(minSide * 0.08)), Math.max(45, Math.round(minSide * 0.18)), Math.max(10, Math.round(minSide * 0.025)));
          const segments = [];
          for (let i = 0; i < lines.rows; i += 1) {
            const x1 = lines.data32S[i * 4];
            const y1 = lines.data32S[i * 4 + 1];
            const x2 = lines.data32S[i * 4 + 2];
            const y2 = lines.data32S[i * 4 + 3];
            const length = Math.hypot(x2 - x1, y2 - y1);
            if (length < minSide * 0.12) continue;
            let angle = Math.atan2(y2 - y1, x2 - x1);
            if (angle < 0) angle += Math.PI;
            segments.push({ x1, y1, x2, y2, length, angle });
          }

          const groups = dominantLineGroups(segments);
          if (groups.length < 2) return;

          for (let i = 0; i < groups.length - 1; i += 1) {
            for (let j = i + 1; j < groups.length; j += 1) {
              const angleDiff = Math.abs(groups[i].angle - groups[j].angle);
              const normalizedDiff = Math.min(angleDiff, Math.PI - angleDiff);
              if (normalizedDiff < Math.PI * 0.28 || normalizedDiff > Math.PI * 0.72) continue;
              const points = quadFromLineGroups(groups[i].segments, groups[j].segments, src.cols, src.rows);
              if (points) candidates.push({ points: orderCorners(points), label: "segments interrompus", methodWeight: 0.92 });
            }
          }
        } catch (error) {
          console.warn("Détection par segments échouée", error);
        } finally {
          deleteMat(gray);
          deleteMat(blurred);
          deleteMat(edges);
          deleteMat(lines);
        }
      }

      function collectQuadCandidates(contours, imageArea, label, methodWeight, candidates) {
        if (!contours || contours.size() === 0) return;

        const minArea = imageArea * 0.012;
        const maxArea = imageArea * 0.96;

        for (let i = 0; i < contours.size(); i += 1) {
          const contour = contours.get(i);
          let approx = null;

          try {
            const area = cv.contourArea(contour);
            if (area < minArea || area > maxArea) continue;

            const peri = cv.arcLength(contour, true);
            approx = new cv.Mat();
            cv.approxPolyDP(contour, approx, Math.max(4, 0.025 * peri), true);

            let points = null;
            let score = area;

            if (approx.rows === 4) {
              points = pointsFromApprox(approx);
              score = rectangularityScore(points, imageArea);
            } else if (area > imageArea * 0.04) {
              points = cv.RotatedRect.points(cv.minAreaRect(contour));
              score = 0.72;
            }

            if (points && score > 0.22) {
              candidates.push({
                points: orderCorners(points),
                label,
                methodWeight,
                contourScore: score
              });
            }
          } finally {
            deleteMat(approx);
            deleteMat(contour);
          }
        }
      }

      function pointsFromApprox(approx) {
        const points = [];
        for (let i = 0; i < 4; i += 1) {
          points.push({
            x: approx.data32S[i * 2],
            y: approx.data32S[i * 2 + 1]
          });
        }
        return points;
      }

      function rectangularityScore(points, imageArea) {
        const ordered = orderCorners(points);
        const sides = [
          distance(ordered[0], ordered[1]),
          distance(ordered[1], ordered[2]),
          distance(ordered[2], ordered[3]),
          distance(ordered[3], ordered[0])
        ];
        const shortest = Math.min(...sides);
        const longest = Math.max(...sides);
        const area = polygonArea(ordered);
        const areaRatio = area / imageArea;
        if (shortest < Math.sqrt(imageArea) * 0.08 || longest / shortest > 4.3 || areaRatio < 0.015 || areaRatio > 0.96) return 0.1;
        const aspectScore = clamp(1 - Math.max(0, longest / shortest - 2.35) / 1.95, 0.25, 1);
        const areaScore = clamp(areaRatio / 0.16, 0.35, 1);
        return aspectScore * 0.55 + areaScore * 0.45;
      }

      function chooseFrameCandidate(src, candidates) {
        if (!candidates.length) return null;

        const unique = [];
        for (const candidate of candidates) {
          const ordered = orderCorners(candidate.points);
          if (!isValidQuad(ordered, src.cols, src.rows)) continue;
          const duplicate = unique.some((item) => averageCornerDistance(item.points, ordered) < Math.min(src.cols, src.rows) * 0.025);
          if (!duplicate) unique.push({ ...candidate, points: ordered });
        }

        let best = null;
        for (const candidate of unique) {
          const geometry = geometryScore(candidate.points, src.cols, src.rows);
          const band = frameBandScore(src, candidate.points);
          const confidence = clamp(
            (geometry * 0.34 + band * 0.46 + (candidate.contourScore || 0.62) * 0.12 + candidate.methodWeight * 0.08),
            0,
            1
          );

          if (!best || confidence > best.confidence) {
            best = { ...candidate, confidence };
          }
        }

        return best;
      }

      function isValidQuad(points, width, height) {
        const area = polygonArea(points);
        if (area < width * height * 0.015 || area > width * height * 0.97) return false;
        const sides = [
          distance(points[0], points[1]),
          distance(points[1], points[2]),
          distance(points[2], points[3]),
          distance(points[3], points[0])
        ];
        const shortest = Math.min(...sides);
        const longest = Math.max(...sides);
        return shortest > Math.min(width, height) * 0.08 && longest / shortest < 4.5;
      }

      function geometryScore(points, width, height) {
        const areaRatio = polygonArea(points) / (width * height);
        const sides = [
          distance(points[0], points[1]),
          distance(points[1], points[2]),
          distance(points[2], points[3]),
          distance(points[3], points[0])
        ];
        const shortest = Math.min(...sides);
        const longest = Math.max(...sides);
        const aspect = longest / shortest;
        const areaScore = clamp((areaRatio - 0.015) / 0.28, 0.25, 1);
        const aspectScore = clamp(1 - Math.max(0, aspect - 2.4) / 2.1, 0.25, 1);
        const margin = Math.min(...points.map((point) => Math.min(point.x, point.y, width - point.x, height - point.y)));
        const marginScore = margin < -6 ? 0.45 : 1;
        return clamp(areaScore * 0.45 + aspectScore * 0.45 + marginScore * 0.1, 0, 1);
      }

      function frameBandScore(src, points) {
        const sides = [
          [points[0], points[1]],
          [points[1], points[2]],
          [points[2], points[3]],
          [points[3], points[0]]
        ];
        const sideScores = sides.map(([a, b]) => scoreFrameSide(src, a, b));
        sideScores.sort((a, b) => b - a);
        const kept = sideScores.slice(0, 3);
        return kept.reduce((sum, value) => sum + value, 0) / kept.length;
      }

      function scoreFrameSide(src, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const length = Math.hypot(dx, dy);
        if (length < 1) return 0;

        const nx = -dy / length;
        const ny = dx / length;
        const band = clamp(Math.min(src.cols, src.rows) * 0.055, 14, 48);
        const samples = [];

        for (let i = 1; i <= 18; i += 1) {
          const t = i / 19;
          const x = a.x + dx * t;
          const y = a.y + dy * t;
          const sample = scoreNormalProfile(src, x, y, nx, ny, band);
          if (sample !== null) samples.push(sample);
        }

        if (!samples.length) return 0;
        samples.sort((x, y) => y - x);
        const kept = samples.slice(0, Math.max(4, Math.ceil(samples.length * 0.68)));
        return kept.reduce((sum, value) => sum + value, 0) / kept.length;
      }

      function scoreNormalProfile(src, x, y, nx, ny, band) {
        const offsets = [-0.45, -0.08, 0.18, 0.38, 0.6, 0.82, 1.06].map((value) => value * band);
        const profile = [];

        for (const offset of offsets) {
          const pixel = samplePixel(src, x + nx * offset, y + ny * offset);
          if (!pixel) return null;
          profile.push(pixel);
        }

        const transitions = [];
        for (let i = 1; i < profile.length; i += 1) {
          transitions.push(
            Math.abs(profile[i].luma - profile[i - 1].luma) / 255 +
            Math.abs(profile[i].sat - profile[i - 1].sat) / 255
          );
        }
        transitions.sort((a, b) => b - a);
        const transitionScore = clamp((transitions[0] + transitions[1] - 0.18) / 0.72, 0, 1);

        const middle = profile.slice(2, 5);
        const side = [profile[1], profile[5]];
        const brightMiddle = Math.max(...middle.map((item) => item.luma));
        const sideLuma = side.reduce((sum, item) => sum + item.luma, 0) / side.length;
        const middleSat = middle.reduce((sum, item) => sum + item.sat, 0) / middle.length;
        const sideSat = side.reduce((sum, item) => sum + item.sat, 0) / side.length;
        const whiteLineScore = clamp(((brightMiddle - sideLuma) / 70 + (sideSat - middleSat) / 90) / 2, 0, 1);
        const coloredSideScore = clamp(sideSat / 95, 0, 1);

        return transitionScore * 0.5 + whiteLineScore * 0.32 + coloredSideScore * 0.18;
      }

      function samplePixel(src, x, y) {
        const px = Math.round(x);
        const py = Math.round(y);
        if (px < 0 || py < 0 || px >= src.cols || py >= src.rows) return null;
        const index = (py * src.cols + px) * src.channels();
        const r = src.data[index];
        const g = src.data[index + 1];
        const b = src.data[index + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        return {
          luma: 0.2126 * r + 0.7152 * g + 0.0722 * b,
          sat: max === 0 ? 0 : ((max - min) / max) * 255
        };
      }

      function dominantLineGroups(segments) {
        if (segments.length < 4) return [];
        const bins = new Array(18).fill(0).map((_, index) => ({ index, weight: 0, segments: [] }));
        for (const segment of segments) {
          const index = Math.min(17, Math.floor(segment.angle / Math.PI * 18));
          bins[index].weight += segment.length;
          bins[index].segments.push(segment);
        }
        return bins
          .filter((bin) => bin.segments.length >= 2)
          .sort((a, b) => b.weight - a.weight)
          .slice(0, 4)
          .map((bin) => ({
            angle: ((bin.index + 0.5) / 18) * Math.PI,
            segments: bin.segments
          }));
      }

      function quadFromLineGroups(groupA, groupB, width, height) {
        const pairA = extremeLinesFromSegments(groupA);
        const pairB = extremeLinesFromSegments(groupB);
        if (!pairA || !pairB) return null;

        const points = [
          lineIntersection(pairA.low, pairB.low),
          lineIntersection(pairA.high, pairB.low),
          lineIntersection(pairA.high, pairB.high),
          lineIntersection(pairA.low, pairB.high)
        ];

        if (points.some((point) => !point)) return null;
        const relaxedBounds = Math.max(width, height) * 0.12;
        if (points.some((point) => point.x < -relaxedBounds || point.y < -relaxedBounds || point.x > width + relaxedBounds || point.y > height + relaxedBounds)) return null;
        return points;
      }

      function extremeLinesFromSegments(segments) {
        if (segments.length < 2) return null;
        const lines = segments.map((segment) => {
          const line = lineFromPoints({ x: segment.x1, y: segment.y1 }, { x: segment.x2, y: segment.y2 });
          return {
            ...line,
            length: segment.length,
            projection: line.a * ((segment.x1 + segment.x2) / 2) + line.b * ((segment.y1 + segment.y2) / 2)
          };
        }).sort((a, b) => a.projection - b.projection);

        const lowGroup = lines.slice(0, Math.max(1, Math.ceil(lines.length * 0.25)));
        const highGroup = lines.slice(Math.max(0, Math.floor(lines.length * 0.75)));
        const low = longestLine(lowGroup);
        const high = longestLine(highGroup);
        if (!low || !high || Math.abs(high.projection - low.projection) < 24) return null;
        return { low, high };
      }

      function lineFromPoints(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const length = Math.hypot(dx, dy) || 1;
        const lineA = dy / length;
        const lineB = -dx / length;
        return {
          a: lineA,
          b: lineB,
          c: -(lineA * a.x + lineB * a.y)
        };
      }

      function lineIntersection(line1, line2) {
        const det = line1.a * line2.b - line2.a * line1.b;
        if (Math.abs(det) < 0.0001) return null;
        return {
          x: (line1.b * line2.c - line2.b * line1.c) / det,
          y: (line2.a * line1.c - line1.a * line2.c) / det
        };
      }

      function longestLine(lines) {
        return lines.reduce((best, line) => (!best || line.length > best.length ? line : best), null);
      }

      function averageCornerDistance(a, b) {
        const orderedA = orderCorners(a);
        const orderedB = orderCorners(b);
        return orderedA.reduce((sum, point, index) => sum + distance(point, orderedB[index]), 0) / 4;
      }

      function polygonArea(points) {
        let area = 0;
        for (let i = 0; i < points.length; i += 1) {
          const current = points[i];
          const next = points[(i + 1) % points.length];
          area += current.x * next.y - next.x * current.y;
        }
        return Math.abs(area) / 2;
      }

      function orderCorners(points) {
        const sortedBySum = [...points].sort((a, b) => (a.x + a.y) - (b.x + b.y));
        const sortedByDiff = [...points].sort((a, b) => (a.x - a.y) - (b.x - b.y));
        return [
          sortedBySum[0],
          sortedByDiff[sortedByDiff.length - 1],
          sortedBySum[sortedBySum.length - 1],
          sortedByDiff[0]
        ];
      }

      async function getDatabase(map) {
        await loadDatabase(map);
        const db = state.db[map];
        if (db.status !== "loaded" || db.rows.length === 0) {
          throw friendlyError(
            "Base indisponible",
            `${CONFIG.dbFiles[map]} n’a pas pu être chargé. Placez ce CSV à côté du fichier HTML et ouvrez la page depuis un serveur local.`
          );
        }
        return db.rows;
      }

      async function loadDatabase(map) {
        const db = state.db[map];
        if (!db || db.status === "loaded") return db ? db.rows : [];
        if (db.status === "loading") {
          await waitUntil(() => db.status !== "loading", 7000);
          return db.rows;
        }

        db.status = "loading";
        db.error = "";
        renderOptions();

        try {
          const text = await fetchText(CONFIG.dbFiles[map], CONFIG.requestTimeoutMs);
          const rows = parseCsv(text, ";").map(normalizePlace).filter(Boolean);
          if (rows.length === 0) throw new Error("aucune ligne valide");

          db.rows = rows;
          db.status = "loaded";
        } catch (error) {
          db.rows = [];
          db.status = "error";
          db.error = explainFetchError(error);
        } finally {
          renderOptions();
        }

        return db.rows;
      }

      function parseCsv(text, delimiter) {
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"') {
            if (quoted && next === '"') {
              field += '"';
              i += 1;
            } else {
              quoted = !quoted;
            }
            continue;
          }

          if (char === delimiter && !quoted) {
            row.push(field);
            field = "";
            continue;
          }

          if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(field);
            if (row.some((value) => value.trim() !== "")) rows.push(row);
            row = [];
            field = "";
            continue;
          }

          field += char;
        }

        row.push(field);
        if (row.some((value) => value.trim() !== "")) rows.push(row);
        if (rows.length < 2) return [];

        const headers = rows[0].map(normalizeHeader);
        return rows.slice(1).map((values) => {
          const item = {};
          headers.forEach((header, index) => {
            item[header] = (values[index] || "").trim();
          });
          return item;
        });
      }

      function normalizeHeader(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "");
      }

      function normalizePlace(row) {
        const lat = toNumber(row.lat ?? row.latitude ?? row.y);
        const lon = toNumber(row.lon ?? row.lng ?? row.longitude ?? row.x);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

        return {
          ...row,
          lat,
          lon,
          nom: cleanText(row.nom ?? row.name ?? row.ville ?? row.city ?? row.lieu ?? ""),
          name: cleanText(row.name ?? row.nom ?? row.ville ?? row.city ?? ""),
          type: cleanText(row.type ?? row.categorie ?? row.category ?? ""),
          adresse: cleanText(row.adresse ?? row.address ?? ""),
          maps: cleanText(row.maps ?? row.google_maps ?? row.googlemap ?? row.url ?? "")
        };
      }

      function findNearest(lat, lon, rows) {
        let bestPlace = null;
        let bestDistance = Infinity;

        for (const place of rows) {
          if (!Number.isFinite(place.lat) || !Number.isFinite(place.lon)) continue;
          const value = distanceKm(lat, lon, place.lat, place.lon);
          if (value < bestDistance) {
            bestDistance = value;
            bestPlace = place;
          }
        }

        return bestPlace ? { place: bestPlace, distance: bestDistance } : null;
      }

      function distanceKm(lat1, lon1, lat2, lon2) {
        const earthRadius = 6371;
        const dLat = degreesToRadians(lat2 - lat1);
        const dLon = degreesToRadians(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(degreesToRadians(lat1)) *
          Math.cos(degreesToRadians(lat2)) *
          Math.sin(dLon / 2) ** 2;
        return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      async function reverseGeocode(lat, lon) {
        try {
          const params = new URLSearchParams({
            format: "jsonv2",
            lat: String(lat),
            lon: String(lon),
            zoom: "10",
            addressdetails: "1",
            "accept-language": "fr"
          });
          const data = await fetchJson(`https://nominatim.openstreetmap.org/reverse?${params}`, CONFIG.requestTimeoutMs);
          const address = data.address || {};
          return {
            city: cleanText(address.city || address.town || address.village || address.municipality || address.hamlet || data.name || "Lieu inconnu"),
            region: cleanText(address.state || address.region || ""),
            department: cleanText(address.county || ""),
            warning: ""
          };
        } catch (error) {
          return {
            city: "Position GPS",
            region: "",
            department: "",
            warning: "Le géocodage réseau n’a pas répondu. Les coordonnées restent disponibles."
          };
        }
      }

      async function getCityInfo(city) {
        if (state.cityInfoCache.has(city)) return state.cityInfoCache.get(city);

        try {
          const data = await fetchJson(
            `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(city)}`,
            4500
          );
          const info = {
            title: cleanText(data.title || city),
            description: cleanText(data.description || ""),
            extract: cleanText(data.extract || "")
          };
          state.cityInfoCache.set(city, info);
          return info;
        } catch (error) {
          state.cityInfoCache.set(city, null);
          return null;
        }
      }

      function warmOpenCv() {
        const start = () => ensureOpenCv().catch(() => { });
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(start, { timeout: 1800 });
        } else {
          window.setTimeout(start, 900);
        }
      }

      function ensureOpenCv() {
        if (isOpenCvReady()) {
          //setEngineState("Analyse prête", "ready");
          return Promise.resolve();
        }

        if (state.cvPromise) return state.cvPromise;

        //setEngineState("Analyse en préparation");
        state.cvPromise = new Promise((resolve, reject) => {
          let settled = false;
          let intervalId = 0;
          let timeoutId = 0;

          const finish = () => {
            if (settled || !isOpenCvReady()) return;
            settled = true;
            window.clearInterval(intervalId);
            window.clearTimeout(timeoutId);
            //setEngineState("Analyse prête", "ready");
            resolve();
          };

          const fail = () => {
            if (settled) return;
            settled = true;
            window.clearInterval(intervalId);
            window.clearTimeout(timeoutId);
            //setEngineState("Analyse indisponible", "error");
            reject(new Error("OpenCV unavailable"));
          };

          window.Module = window.Module || {};
          window.Module.onRuntimeInitialized = finish;

          if (!document.querySelector("script[data-opencv]")) {
            const script = document.createElement("script");
            script.src = CONFIG.cvUrl;
            script.async = true;
            script.defer = true;
            script.dataset.opencv = "true";
            script.onerror = fail;
            script.onload = () => {
              if (window.cv) window.cv.onRuntimeInitialized = finish;
              finish();
            };
            document.head.append(script);
          }

          intervalId = window.setInterval(finish, 120);
          timeoutId = window.setTimeout(fail, 22000);
        }).catch((error) => {
          state.cvPromise = null;
          throw friendlyError(
            "Analyse indisponible",
            "OpenCV n’a pas pu se charger. Vérifiez la connexion internet, puis rechargez la page.",
            error
          );
        });

        return state.cvPromise;
      }

      function ensureHeicConverter() {
        if (window.heic2any) return Promise.resolve();
        if (state.heicPromise) return state.heicPromise;

        state.heicPromise = loadScript(CONFIG.heicUrl).catch((error) => {
          state.heicPromise = null;
          throw friendlyError("Conversion HEIC indisponible", "Le convertisseur HEIC n’a pas pu se charger. Exportez la photo en JPEG.", error);
        });
        return state.heicPromise;
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`Script unavailable: ${src}`));
          document.head.append(script);
        });
      }

      function isOpenCvReady() {
        return Boolean(window.cv && window.cv.Mat && window.cv.imread && window.cv.getPerspectiveTransform);
      }

      async function fetchText(url, timeoutMs) {
        const response = await fetchWithTimeout(url, timeoutMs);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      }

      async function fetchJson(url, timeoutMs) {
        const response = await fetchWithTimeout(url, timeoutMs);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }

      function fetchWithTimeout(url, timeoutMs) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
        return fetch(url, {
          signal: controller.signal,
          cache: "force-cache"
        }).finally(() => window.clearTimeout(timeout));
      }

      function waitUntil(predicate, timeoutMs) {
        const started = performance.now();
        return new Promise((resolve) => {
          const tick = () => {
            if (predicate() || performance.now() - started > timeoutMs) {
              resolve();
              return;
            }
            window.setTimeout(tick, 60);
          };
          tick();
        });
      }

      function friendlyError(title, userMessage, originalError = null) {
        const error = originalError instanceof Error ? originalError : new Error(userMessage);
        error.title = title;
        error.userMessage = userMessage;
        return error;
      }

      function explainFetchError(error) {
        if (error && error.name === "AbortError") return "délai dépassé";
        if (location.protocol === "file:") return "ouvrez la page depuis un serveur local pour autoriser le chargement du CSV";
        return "fichier introuvable ou illisible";
      }

      function safeExternalUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
        } catch {
          return "";
        }
      }

      function googleMapsUrl(query) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      }

      function cleanText(value) {
        return String(value || "").replace(/\s+/g, " ").trim();
      }

      function normalizeType(value) {
        return cleanText(value).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      function toNumber(value) {
        if (typeof value === "number") return value;
        const normalized = String(value || "").trim().replace(",", ".");
        return Number(normalized);
      }

      function degreesToRadians(value) {
        return value * Math.PI / 180;
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function deleteMat(value) {
        if (value && typeof value.delete === "function") {
          value.delete();
        }
      }
    })();
  </script>
</body>
