  <script>
    /* =========================

    ========================= */
    let canvas = document.getElementById("canvas");
    let ctx = canvas.getContext("2d");

    let warpCanvas = document.getElementById("canvasWarp");
    let wctx = warpCanvas.getContext("2d");

    let img = new Image();

    let clickPoint = null;
    let Hmatrix = null;
    let warpedMap = null;

    let currentObjectURL = null;

    /* =========================
        RESET GAME
    ========================= */
    function resetGame() {

      clickPoint = null;
      Hmatrix = null;

      if (warpedMap) {
        warpedMap.delete();
        warpedMap = null;
      }

      document.getElementById("output").innerHTML = "";

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      wctx.clearRect(
        0,
        0,
        warpCanvas.width,
        warpCanvas.height
      );
    }

    /* =========================
       LOAD IMAGE
    ========================= */
    document.getElementById("fileInput").onchange = async (e) => {

      let file = e.target.files[0];
      if (!file) return;

      // Réinitialisation complète

      clickPoint = null;
      Hmatrix = null;

      if (warpedMap) {
        warpedMap.delete();
        warpedMap = null;
      }

      document.getElementById("output").innerHTML = "";

      wctx.clearRect(
        0,
        0,
        warpCanvas.width,
        warpCanvas.height
      );

      try {

        let imageBlob = file;

        /* =========================
           HEIC -> JPEG
        ========================= */
        if (
          file.type === "image/heic" ||
          file.type === "image/heif" ||
          file.name.toLowerCase().endsWith(".heic") ||
          file.name.toLowerCase().endsWith(".heif")
        ) {

          document.getElementById("status").innerText =
            "Conversion HEIC → JPEG...";

          imageBlob = await heic2any({
            blob: file,
            toType: "image/jpeg",
            quality: 0.95
          });

          if (Array.isArray(imageBlob)) {
            imageBlob = imageBlob[0];
          };

          document.getElementById("status").innerText =
            "Image convertie";
        }

        img.onload = () => {

          const MAX_SIZE = 2500;

          let scale = Math.min(
            1,
            MAX_SIZE / Math.max(img.width, img.height)
          );

          canvas.width =
            Math.round(img.width * scale);

          canvas.height =
            Math.round(img.height * scale);

          warpCanvas.width =
            canvas.width;

          warpCanvas.height =
            canvas.height;

          /*
          if (img.width * img.height > 25000000) {

            resetGame();

            alert(
              "Photo trop grande. Utilisez une photo de 12MP maximum."
            );

            return;
          }*/

          /*
                    canvas.width = img.width;
                    canvas.height = img.height;
          
                    warpCanvas.width = img.width;
                    warpCanvas.height = img.height;
          */
          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );
        };

        if (currentObjectURL) {
          URL.revokeObjectURL(currentObjectURL);
        }

        currentObjectURL =
          URL.createObjectURL(imageBlob);

        img.src = currentObjectURL;
      }
      catch (err) {

        console.error(err);

        alert(
          "Impossible de lire cette image."
        );
      }
    };

    /* =========================
       CLICK IMPACT
    ========================= */
    canvas.addEventListener("click", (e) => {
      let r = canvas.getBoundingClientRect();

      let x = (e.clientX - r.left) * (canvas.width / r.width);
      let y = (e.clientY - r.top) * (canvas.height / r.height);

      clickPoint = { x, y };

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawImpact(
        ctx,
        x,
        y
      );

      requestAnimationFrame(() => {
        run();
      });
    });


    /* =========================
       DETECT HEXAGONES ROUGES
    ========================= */
    function orderCorners(pts) {

      let sum = pts.map(p => p.x + p.y);
      let diff = pts.map(p => p.x - p.y);

      let tl = pts[sum.indexOf(Math.min(...sum))];
      let br = pts[sum.indexOf(Math.max(...sum))];

      let tr = pts[diff.indexOf(Math.max(...diff))];
      let bl = pts[diff.indexOf(Math.min(...diff))];

      return [tl, tr, br, bl];
    }

    /* =========================
       DETECT CADRE CIBLE
    ========================= */
    function detectCorners(src) {

      let blurred = new cv.Mat();
      let gray = new cv.Mat();
      let edges = new cv.Mat();

      cv.GaussianBlur(src, blurred, new cv.Size(5, 5), 0);
      cv.cvtColor(blurred, gray, cv.COLOR_RGBA2GRAY);

      // Détection des contours forts (cadres)
      cv.Canny(gray, edges, 60, 180);

      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();

      cv.findContours(
        edges,
        contours,
        hierarchy,
        cv.RETR_TREE, // IMPORTANT pour hiérarchie (cadres imbriqués)
        cv.CHAIN_APPROX_SIMPLE
      );

      let bestPair = null;
      let bestScore = 0;

      for (let i = 0; i < contours.size(); i++) {

        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);

        if (area < 5000) continue;

        let peri = cv.arcLength(cnt, true);
        let approx = new cv.Mat();

        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

        if (approx.rows !== 4) {
          approx.delete();
          continue;
        }

        // rectangle candidate
        let rect = cv.boundingRect(cnt);

        let child = hierarchy.intPtr(0, i)[2]; // enfant dans hiérarchie

        if (child >= 0) {

          let cnt2 = contours.get(child);
          let area2 = cv.contourArea(cnt2);

          if (area2 < 3000) continue;

          let approx2 = new cv.Mat();
          let peri2 = cv.arcLength(cnt2, true);

          cv.approxPolyDP(cnt2, approx2, 0.02 * peri2, true);

          if (approx2.rows !== 4) {
            approx2.delete();
            continue;
          }

          // 🔲 vérif imbriqué + forme similaire
          let score = area2; // tu peux améliorer avec ratio / distance

          if (score > bestScore) {

            let pts = [];

            for (let k = 0; k < 4; k++) {
              pts.push({
                x: approx2.data32S[k * 2],
                y: approx2.data32S[k * 2 + 1]
              });
            }

            bestPair = orderCorners(pts);
            bestScore = score;
          }

          approx2.delete();
        }

        approx.delete();
      }

      blurred.delete();
      gray.delete();
      edges.delete();
      contours.delete();
      hierarchy.delete();

      return bestPair;
    }

    function drawCityName(ctx, text, x, y) {

      let maxWidth =
        warpCanvas.width - x - 20;

      let size = 96;

      do {

        ctx.font = `bold ${size}px Arial`;

        let w =
          ctx.measureText(text).width;

        if (w <= maxWidth)
          break;

        size -= 2;

      } while (size > 32);

      ctx.font = `bold ${size}px Arial`;

      ctx.strokeStyle = "black";
      ctx.lineWidth = Math.max(4, size / 6);

      ctx.strokeText(text, x, y);

      ctx.fillStyle = "#FFD54F";
      ctx.strokeStyle = "#111";
      ctx.fillText(text, x, y);


    }

    function drawImpact(ctx, x, y) {

      ctx.lineWidth = 20;
      ctx.strokeStyle = "#FF0000";

      // cercle extérieur
      ctx.beginPath();
      ctx.arc(x, y, 90, 0, Math.PI * 2);
      ctx.stroke();

      // cercle intérieur
      ctx.beginPath();
      ctx.arc(x, y, 54, 0, Math.PI * 2);
      ctx.stroke();

      // centre
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fillStyle = "#FF0000";
      ctx.fill();
    }

    /* =====================
       CHARGEMENT BDD CSV
    ===================== */
    async function loadCSV(file) {

        .then(r => r.text());

      const result = Papa.parse(text, {
        header: true,
        delimiter: ";",
        dynamicTyping: true,
        skipEmptyLines: true
      });

      return result.data;
    }

    /* =====================
       CHARGEMENT BDD
    ===================== */
    async function loadDatabase() {

      try {

        if (currentMap === "france") {

          villesDB =
            await loadCSV("bdd_villes.csv");

        } else {

          villesDB =
            await loadCSV("bdd_lyon.csv");

        }

        console.log(
          "BDD chargée",
          villesDB.length,
          "entrées"
        );

      }
      catch (e) {

        console.error(
          "Erreur chargement CSV",
          e
        );
      }
    }

    /* =====================
       CALCUL DISTANCE
    ===================== */
    function distanceKm(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371;

      let dLat =
        (lat2 - lat1) *
        Math.PI / 180;

      let dLon =
        (lon2 - lon1) *
        Math.PI / 180;

      let a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      let c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;
    }

    /* =========================
       RECHERCHE VILLE PROCHE
    ========================= */
    function findNearestCity(
      lat,
      lon
    ) {

      let bestCity = null;

      let bestDistance =
        Infinity;

      for (const city of villesDB) {

        let d =
          distanceKm(
            lat,
            lon,
            city.lat,
            city.lon
          );

        if (d < bestDistance) {

          bestDistance = d;
          bestCity = city;
        }
      }

      return {
        city: bestCity,
        distance: bestDistance
      };
    }

    /* =========================
       RECHERCHE ADRESSE PROCHE
    ========================= */
    function findNearestCityInList(
      lat,
      lon,
      liste
    ) {

      let bestCity = null;
      let bestDistance = Infinity;

      for (const city of liste) {

        let d =
          distanceKm(
            lat,
            lon,
            city.lat,
            city.lon
          );

        if (d < bestDistance) {

          bestDistance = d;
          bestCity = city;

        }
      }

      return {
        city: bestCity,
        distance: bestDistance
      };
    }
    /* =========================
       MAIN PIPELINE
    ========================= */
    async function run() {

      if (!clickPoint) {
        document.getElementById("output").innerText =
          "❌ Aucun impact sélectionné";
        return;
      }

      if (!cv || !cv.imread) {
        document.getElementById("output").innerText =
          "❌ OpenCV pas encore totalement chargé";
        return;
      }

      let src;

      try {
        let tempCanvas = document.createElement("canvas");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;

        let tempCtx = tempCanvas.getContext("2d");

        tempCtx.drawImage(
          img,
          0,
          0,
          tempCanvas.width,
          tempCanvas.height
        );

        // ✅ D'ABORD lire l'image
        src = cv.imread(tempCanvas);


        try {
          let small = new cv.Mat();

          cv.resize(
            src,
            small,
            new cv.Size(),
            0.4,
            0.4,
            cv.INTER_AREA
          );
          src = cv.imread(tempCanvas);

        }
        catch (err) {

          console.error(err);

          document.getElementById("output").innerHTML =
            "❌ OpenCV n'a pas réussi à lire la photo";

          return;
        }
      }
      catch (e) {

        document.getElementById("output").innerHTML =
          "❌ Impossible de lire cette photo";

        return;
      }
      let corners = detectCorners(src);

      if (!corners) {
        document.getElementById("output").innerText =
          "❌ Cadre vert non détecté, reprendre la photo de sorte que la cadre de la cible soit entièrement sur l'image.";
        return;
      }
      console.log("corners =", corners);

      let S = Math.min(canvas.width, canvas.height);

      let srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
        corners[0].x, corners[0].y,
        corners[1].x, corners[1].y,
        corners[2].x, corners[2].y,
        corners[3].x, corners[3].y
      ]);

      let dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
        0, 0,
        S, 0,
        S, S,
        0, S
      ]);

      Hmatrix = cv.getPerspectiveTransform(srcPts, dstPts);

      /* =========================
         IMPACT TRANSFORM
      ========================= */
      let p = cv.matFromArray(1, 1, cv.CV_32FC2, [clickPoint.x, clickPoint.y]);
      let out = new cv.Mat();

      cv.perspectiveTransform(p, out, Hmatrix);

      let x = out.data32F[0];
      let y = out.data32F[1];

      let warped = new cv.Mat();
      cv.warpPerspective(src, warped, Hmatrix, new cv.Size(S, S));

      /* =========================
         GPS FRANCE
      ========================= */
      let ZONE;

      if (currentMap === "france") {

        ZONE = {
          latMin: 41,
          latMax: 51.5,
          lonMin: -5.5,
          lonMax: 9.8
        };

      }
      else {

        ZONE = {
          latMin: 45.70,
          latMax: 45.83,
          lonMin: 4.75,
          lonMax: 4.92
        };

      }

      let lon =
        ZONE.lonMin +
        (x / S) * (ZONE.lonMax - ZONE.lonMin);

      let lat =
        ZONE.latMax -
        (y / S) * (ZONE.latMax - ZONE.latMin);

      /* =========================
         GEOCODING
      ========================= */
      let j = await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`,
        { headers: { "User-Agent": "dart" } }
      ).then(r => r.json());

      let city =
        j.address?.city ||
        j.address?.town ||
        j.address?.village ||
        "Lieu inconnu";

      let cityInfo = await getCityInfo(city);

      let region =
        j.address?.state || "Inconnue";

      let departement =
        j.address?.county || "Inconnu";

      let displayedCity = "";
      let nearest = null;

      if (currentMap === "france") {

        let mode =
          document.getElementById(
            "resultMode"
          ).value;

        if (mode === "database") {

          nearest =
            findNearestCity(lat, lon);

          displayedCity =
            nearest?.city?.nom ||
            nearest?.city?.name ||
            nearest?.city?.city ||
            "Ville inconnue";

        } else {

          displayedCity = city;

        }

      } else {

        let lyonMode =
          document.getElementById("lyonMode").value;

        let lieuxFiltres = villesDB;

        if (lyonMode !== "all") {
          lieuxFiltres = villesDB.filter(
            lieu => lieu.type === lyonMode
          );
        }

        nearest = findNearestCityInList(
          lat,
          lon,
          lieuxFiltres
        );

        displayedCity =
          nearest.city?.nom ||
          nearest.city?.name ||
          "Lieu inconnu";
      }

      /* =========================
         DRAW RESULT
      ========================= */
      /*cv.circle(warped,new cv.Point(x,y),14,[0,0,255,255],-1);*/


      cv.imshow("canvasWarp", warped);

      drawImpact(
        wctx,
        x,
        y
      );

      drawCityName(
        wctx,
        displayedCity,
        x + 20,
        y - 20
      );

      let maps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(city + " France")}`;

      if (currentMap === "france") {

        document.getElementById("output").innerHTML = `
<h3>🎯 Impact détecté</h3>

<h2>🏙️ ${displayedCity}</h2>

🌍 Région : ${region}<br>
🏛️ Département : ${departement}<br>

${cityInfo ? `
<b>${cityInfo.description}</b>
${cityInfo.extract}<br>
` : ""}

📍 Coordonnées GPS :
${lat.toFixed(6)},
${lon.toFixed(6)}
<br>
👉 <a target="_blank" href="${maps}">
Ouvrir dans Google Maps
</a>
`;

      } else {

        document.getElementById("output").innerHTML = `
<h3>🍷 Destination du soir</h3>

<h2>${nearest.city.nom}</h2>

📍 ${nearest.city.adresse || ""}<br>

🍽️ ${nearest.city.type || ""}<br>

📏 ${nearest.distance.toFixed(2)} km<br><br>

<a
  href="${nearest.city.maps}"
  target="_blank"
  style="
    display:inline-block;
    padding:10px 15px;
    background:#2e7d32;
    color:white;
    text-decoration:none;
    border-radius:8px;
  "
>
🗺️ Ouvrir dans Google Maps
</a>
`;

      }

      src.delete();
      p.delete();
      out.delete();
      warped.delete();
    }

    async function getCityInfo(city) {
      try {

        let r = await fetch(
          `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(city)}`
        );

        if (!r.ok) return null;

        let j = await r.json();

        return {
          title: j.title,
          description: j.description || "",
          extract: j.extract || ""
        };

      } catch (e) {

        return null;
      }
    }

    /* =========================
       SELECTION CARTE
    ========================= */
    document.getElementById("modeFranceBtn").onclick = () => {

      currentMap = "france";
      loadDatabase();
      updateOptions();

    };

    document.getElementById("modeLyonBtn").onclick = () => {

      currentMap = "lyon";
      loadDatabase();
      updateOptions();

    };

    updateOptions();



    /* =========================
       RESULTS CARTE
    ========================= */
    function updateOptions() {

      let div =
        document.getElementById("optionsCard");

      if (currentMap === "france") {

        div.innerHTML = `

  <b>🇫🇷 Mode France</b><br><br>

  <select id="resultMode">

    <option value="real">
    📍 Ville réelle touchée
    </option>

    <option value="database">
    🏙️ Ville la plus proche de la base
    </option>

  </select>

  `;

        let resultMode =
          document.getElementById("resultMode");

        if (resultMode) {

          resultMode.addEventListener(
            "change",
            () => {
              if (clickPoint) run();
            }
          );

        }
      }

      else {

        div.innerHTML = `

  <b>🍷 Mode Lyon</b><br><br>

  <select id="lyonMode">

    <option value="all">
    🎲 Tout
    </option>

    <option value="bar">
    🍺 Bars
    </option>

    <option value="resto">
    🍽️ Restaurants
    </option>

    <option value="activite">
    🎯 Activités
    </option>

  </select>

  `;

      }

    }

    /* =========================
       REPRENDRE IMPACT
    ========================= */
    document.getElementById("retryBtn").onclick = () => {

      clickPoint = null;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      wctx.clearRect(
        0,
        0,
        warpCanvas.width,
        warpCanvas.height
      );

      document.getElementById("output").innerHTML =
        "👉 Cliquez sur le nouvel impact de fléchette.";
    };

    /* =========================
       NOUVELLE PARTIE
    ========================= */
    document.getElementById("resetBtn").onclick = () => {

      resetGame();

      img.src = "";

      document.getElementById("fileInput").value = "";

      if (currentObjectURL) {
        URL.revokeObjectURL(currentObjectURL);
        currentObjectURL = null;
      }

      canvas.width = 0;
      canvas.height = 0;

      warpCanvas.width = 0;
      warpCanvas.height = 0;
    };


    window.addEventListener(
      "load",
      loadDatabase
    );



  </script>

</body>

</html>
